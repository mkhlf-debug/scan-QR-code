<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الحضور</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; border: 2px solid #334155; background: #1e293b; padding-bottom: 15px; }
        h2 { color: #38bdf8; margin-bottom: 20px;}
        #status { display: none; color: #4ade80; font-size: 18px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>ماسح الحضور الذكي</h2>
    
    <div id="reader"></div>
    <div id="status">✅ جاري فتح نظام الجامعة...</div>

    <script>
        function onScanSuccess(decodedText) {
            // إيقاف الكاميرا فوراً وإظهار رسالة التحميل
            html5QrcodeScanner.clear();
            document.getElementById('status').style.display = 'block';
            
            let originalUrl = decodedText.trim();
            
            // رابط Vercel الخاص بك
            let vercelProxyUrl = "https://zad-proxy1.vercel.app";
            let finalUrl = originalUrl;
            
            // استبدال الـ IP بنطاق فيرسيل مع الحفاظ على باقي المسار
            if (originalUrl.includes("193.227.46.44")) {
                finalUrl = originalUrl.replace("http://193.227.46.44", vercelProxyUrl)
                                      .replace("https://193.227.46.44", vercelProxyUrl);
            }

            // توجيه المتصفح فوراً للمنصة
            window.location.href = finalUrl;
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 20, qrbox: {width: 250, height: 250} }, false
        );
        html5QrcodeScanner.render(onScanSuccess, () => {});
    </script>
</body>
</html>
