<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح حضور الكلية</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 20px;
        }
        h2 { margin: 0; color: #4DA8DA; }
    </style>
</head>
<body>

    <h2>ماسح الحضور الذكي</h2>
    <p>وجه الكاميرا نحو كود المحاضرة</p>
    
    <div id="reader"></div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // إيقاف الكاميرا بمجرد التقاط الكود
            html5QrcodeScanner.clear();
            
            // معالجة الرابط واستبدال الـ IP برابط Vercel الخاص بك
            let finalUrl = decodedText;
            if(decodedText.includes("193.227.46.44")) {
                finalUrl = decodedText.replace("http://193.227.46.44", "https://zad-proxy.vercel.app");
            }
            
            // التوجيه الفوري لصفحة تسجيل الدخول
            window.location.href = finalUrl;
        }

        function onScanFailure(error) {
            // تجاهل الأخطاء أثناء محاولة قراءة الكود
        }

        // تشغيل الكاميرا الخلفية تلقائياً
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 15, qrbox: {width: 250, height: 250} },
            false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
