<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح الحضور - كروكسي</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 20px;}
        #status { margin-top: 20px; font-size: 18px; color: #4ade80; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <h2>ماسح الحضور الذكي</h2>
    <div id="reader"></div>
    <div id="status">✅ تم نسخ رابط الكلية!<br>جاري تحويلك لكروكسي...</div>

    <script>
        function onScanSuccess(decodedText) {
            // إيقاف الكاميرا وإظهار رسالة النجاح
            html5QrcodeScanner.clear();
            document.getElementById('status').style.display = 'block';
            
            // حيلة برمجية لنسخ الرابط أوتوماتيكياً للحافظة
            const tempInput = document.createElement("input");
            tempInput.value = decodedText.trim();
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            // تحويلك فوراً لموقع كروكسي بعد نصف ثانية
            setTimeout(() => {
                window.location.href = "https://www.croxyproxy.com/";
            }, 500);
        }

        // تشغيل الكاميرا
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 20, qrbox: {width: 250, height: 250} }, false
        );
        html5QrcodeScanner.render(onScanSuccess, () => {});
    </script>
</body>
</html>
