<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #reader { width: 100%; max-width: 400px; border-radius: 12px; overflow: hidden; border: 2px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 20px;}
        #actionArea { display: none; margin-top: 20px; width: 100%; max-width: 400px; }
        .btn { background: #10b981; color: white; border: none; padding: 15px 20px; font-size: 18px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
        .btn:active { background: #059669; }
        .url-box { background: #1e293b; padding: 10px; border-radius: 8px; border: 1px solid #475569; word-break: break-all; margin-top: 10px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <h2>scan QR </h2>
    
    <div id="reader"></div>
    
    <div id="actionArea">
        <h3 style="color: #4ade80; margin: 0;">✅ تم التقاط الكود بنجاح</h3>
        <div id="scannedUrl" class="url-box"></div>
        <button class="btn" onclick="copyAndGo()">نسخ الرابط وافتح كروكسي 🚀</button>
    </div>

    <script>
        let finalUrl = "";

        function onScanSuccess(decodedText) {
          
            html5QrcodeScanner.clear();
            
            finalUrl = decodedText.trim();
            
    
            document.getElementById('scannedUrl').innerText = finalUrl;
            document.getElementById('actionArea').style.display = 'block';
        }

        function copyAndGo() {
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(finalUrl).then(() => {
                    window.location.href = "https://www.croxyproxy.com/";
                });
            } else {
            
                const tempInput = document.createElement("input");
                tempInput.value = finalUrl;
                document.body.appendChild(tempInput);
                tempInput.select();
                tempInput.setSelectionRange(0, 99999);
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                window.location.href = "https://www.croxyproxy.com/";
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 20, qrbox: {width: 250, height: 250} }, false
        );
        html5QrcodeScanner.render(onScanSuccess, () => {});
    </script>
</body>
</html>
