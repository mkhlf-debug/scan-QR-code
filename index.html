<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حضور الكلية الذكي</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 15px;
        }
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            background: black;
        }
        h2 { color: #38bdf8; margin: 0 0 10px 0; font-size: 22px; }
        .input-group {
            margin: 15px 0;
            text-align: right;
        }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-copy { background: #334155; margin-top: 5px; }
        .status { margin-top: 15px; font-size: 14px; color: #38bdf8; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h2>منظومة الحضور السريع</h2>
        
        <!-- قسم حفظ بيانات الطالب -->
        <div class="input-group">
            <label>اسم المستخدم / كود الطالب الخاص بك:</label>
            <input type="text" id="studentUser" placeholder="أدخل اسم المستخدم هنا">
            <button class="btn btn-copy" onclick="copyUsername()">📋 نسخ اسم المستخدم للحافظة</button>
        </div>

        <div id="reader"></div>
        <div id="statusMsg" class="status">الكاميرا جاهزة لمسح الكود...</div>
    </div>

    <script>
        const studentInput = document.getElementById('studentUser');
        const statusMsg = document.getElementById('statusMsg');

        // استرجاع اسم المستخدم المحفوظ تلقائياً
        const savedUser = localStorage.getItem('college_username');
        if (savedUser) studentInput.value = savedUser;

        studentInput.addEventListener('input', () => {
            localStorage.setItem('college_username', studentInput.value.trim());
        });

        function copyUsername() {
            if (!studentInput.value) {
                alert('يرجى كتابة اسم المستخدم أولاً');
                return;
            }
            navigator.clipboard.writeText(studentInput.value).then(() => {
                statusMsg.innerText = "✅ تم نسخ اسم المستخدم، وجه الكاميرا للكود الآن";
            });
        }

        function onScanSuccess(decodedText) {
            html5QrcodeScanner.clear();
            statusMsg.innerText = "⚡ جاري التوجيه لنظام الكلية...";

            let targetUrl = decodedText.trim();

            // استبدال الـ IP بنطاق Vercel السليم للحفاظ على مسار الجلسة كاملاً
            if (targetUrl.includes("193.227.46.44")) {
                targetUrl = targetUrl.replace("http://193.227.46.44", "https://zad-proxy.vercel.app");
                targetUrl = targetUrl.replace("https://193.227.46.44", "https://zad-proxy.vercel.app");
                targetUrl = targetUrl.replace("193.227.46.44", "zad-proxy.vercel.app");
            }

            // التأكد من وجود البروتوكول
            if (!targetUrl.startsWith("http://") && !targetUrl.startsWith("https://")) {
                targetUrl = "https://" + targetUrl;
            }

            window.location.href = targetUrl;
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 20, qrbox: {width: 250, height: 250} },
            false
        );
        html5QrcodeScanner.render(onScanSuccess, () => {});
    </script>
</body>
</html>
